services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    image: botforge-backend:local
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  bot-worker:
    image: botforge-backend:local
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    command: ["sh", "-c", "alembic upgrade head && python -m app.bots.worker"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  dashboard:
    build: ./dashboard
    image: botforge-dashboard:local
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
volumes:
  postgres_data:

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "botforge-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "aiogram>=3,<4",
  "sqlalchemy[asyncio]>=2,<3", "asyncpg>=0.29,<1",
  "alembic>=1.13,<2", "pydantic-settings>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "aiosqlite>=0.20,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.i18n" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
